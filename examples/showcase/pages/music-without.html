<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibely</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Poppins,sans-serif;color:#fff;background:#0d0618}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.55;z-index:-1}
.b1{width:520px;height:520px;background:#8b5cf6;top:-120px;left:-100px}.b2{width:460px;height:460px;background:#ec4899;bottom:-100px;right:-60px}.b3{width:300px;height:300px;background:#3b82f6;top:40%;left:45%}
nav{display:flex;justify-content:space-between;align-items:center;padding:22px 48px}
.logo{font-weight:700;font-size:24px;background:linear-gradient(90deg,#a78bfa,#f472b6);-webkit-background-clip:text;color:transparent}
.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(20px);border-radius:20px}
nav .glass{padding:8px 10px;display:flex;gap:4px}nav .glass a{padding:8px 16px;border-radius:12px;color:#ddd;text-decoration:none;font-size:14px}nav .glass a:first-child{background:rgba(255,255,255,.15)}
.btn{background:linear-gradient(135deg,#8b5cf6,#ec4899);border:0;color:#fff;padding:12px 24px;border-radius:14px;font-weight:600;box-shadow:0 10px 30px rgba(236,72,153,.35)}
.hero{margin:20px 48px;padding:40px;display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}
.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:12px;color:#c4b5fd;font-weight:600}
h1{font-size:52px;line-height:1.1;margin:12px 0}h1 span{background:linear-gradient(90deg,#a78bfa,#f472b6);-webkit-background-clip:text;color:transparent}
.hero p{color:#cbd5e1;font-size:17px}
.np{padding:24px;text-align:center}.np .art{aspect-ratio:1;border-radius:16px;background:linear-gradient(135deg,#8b5cf6,#ec4899,#f59e0b);display:grid;place-items:center;font-size:80px;margin-bottom:16px}
h2{margin:30px 48px 16px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;margin:0 48px 48px}
.pl{padding:14px}.pl .a{aspect-ratio:1;border-radius:12px;margin-bottom:10px}.pl b{display:block;font-size:14px}.pl small{color:#a1a1aa}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<nav><div class="logo">🎧 Vibely</div><div class="glass"><a href="#">Home</a><a href="#">Discover</a><a href="#">Library</a><a href="#">Friends</a></div><button class="btn">Go Premium ✨</button></nav>
<section class="hero glass"><div><div class="eyebrow">✨ AI-Powered Music</div><h1>Discover your <span>perfect vibe</span></h1><p>Unlock personalized playlists curated by AI, seamlessly synced with your mood, your friends, and your moments.</p><button class="btn">Start Listening →</button></div>
<div class="np glass"><div class="art">🎵</div><b>Midnight Drive</b><div style="color:#a1a1aa">Neon Dreams</div></div></section>
<h2>Made for You 💜</h2>
<div class="grid" id="g"></div>
<script>
const c=[["#8b5cf6","#ec4899"],["#3b82f6","#8b5cf6"],["#f59e0b","#ec4899"],["#10b981","#3b82f6"],["#ec4899","#f43f5e"]],t=["Chill Vibes","Focus Flow","Late Night","Workout Mix","Feel Good"];
document.getElementById('g').innerHTML=t.map((x,i)=>`<div class="pl glass"><div class="a" style="background:linear-gradient(135deg,${c[i][0]},${c[i][1]})"></div><b>${x}</b><small>AI Playlist · 42 songs</small></div>`).join('');
</script></body></html>
